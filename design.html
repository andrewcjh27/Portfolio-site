  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      background: #FFFFFC;
      color: #111;
      overflow-x: hidden;
    }

    /* ─── Header / Nav ─────────────────────────────────────────────── */
    .site-header {
      background: rgba(255, 255, 252, 0.78) !important;
      border-bottom: 1px solid rgba(0,0,0,0.06) !important;
      -webkit-backdrop-filter: blur(22px) saturate(120%);
      backdrop-filter: blur(22px) saturate(120%);
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 100;
    }
    .site-header .logo { color: #2a2520; }
    .site-header .hamburger svg { stroke: #2a2520; }
    .site-header .nav-link { color: #555; }
    .site-header .nav-link:hover { background: #efece6; color: #111; }
    .site-header .nav-link.active { background: #111; color: #faf7f2; }

    /* ─── Page shell ─────────────────────────────────────────────── */
    .design-main {
      position: relative;
      min-height: 100vh;
      padding: 6rem 3rem 2rem;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    /* ─── Carousel — focused center card with peeking sides ──────── */
    .carousel {
      flex: 1;
      position: relative;
      margin-top: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      perspective: 1600px;
      perspective-origin: 50% 45%;
      min-height: clamp(480px, 64vh, 660px);
    }
    .carousel-stage {
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      transform-style: preserve-3d;
    }

    /* Card wrappers — positioned absolutely, animated by JS */
    .carousel-card {
      position: absolute;
      top: 50%;
      left: 50%;
      width: clamp(280px, 38vw, 400px);
      height: clamp(260px, 40vw, 500px);
      transform-origin: 50% 50%;
      transition: transform 0.7s cubic-bezier(0.22, 1, 0.36, 1),
                  opacity   0.7s cubic-bezier(0.22, 1, 0.36, 1),
                  filter    0.7s cubic-bezier(0.22, 1, 0.36, 1);
      cursor: pointer;
      will-change: transform;
    }
    /* Inactive cards are dimmed and de-saturated */
    .carousel-card:not(.is-active) {
      filter: grayscale(0.85) brightness(1.05);
      opacity: 0.55;
    }
    .carousel-card.is-far {
      opacity: 0.18;
      filter: grayscale(1) brightness(1.05);
    }

    /* Inner "paper" — receives cursor-driven rotateX/rotateY.
       No rectangular framing — the PNG's own shape IS the card. */
    .card-paper {
      position: relative;
      width: 100%;
      height: 100%;
      transform-style: preserve-3d;
      transition: filter 0.5s ease;
      filter: drop-shadow(0 14px 22px rgba(0,0,0,0.12));
      will-change: transform, filter;
    }
    .carousel-card.is-active .card-paper {
      filter:
        drop-shadow(0 38px 38px rgba(0,0,0,0.22))
        drop-shadow(0 14px 18px rgba(0,0,0,0.14));
    }

    /* The PNG itself — preserves its native shape via object-fit: contain
       and transparent background. The image's alpha channel defines the
       visible card. */
    .card-image {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: contain;
      object-position: center;
      pointer-events: none;
      user-select: none;
      -webkit-user-drag: none;
    }

    /* Cursor-following gloss/shine overlay — masked by the same PNG so
       the highlight only appears on opaque pixels of the image. Each
       card sets --card-img via inline style. */
    .card-shine {
      position: absolute;
      inset: 0;
      pointer-events: none;
      mix-blend-mode: screen;
      opacity: 0;
      transition: opacity 0.4s ease;
      -webkit-mask-image: var(--card-img);
              mask-image: var(--card-img);
      -webkit-mask-size: contain;
              mask-size: contain;
      -webkit-mask-position: center;
              mask-position: center;
      -webkit-mask-repeat: no-repeat;
              mask-repeat: no-repeat;
    }
    .carousel-card.is-active .card-shine { opacity: 1; }

    /* Center label under active card */
    .carousel-label {
      position: absolute;
      left: 50%;
      bottom: 2rem;
      transform: translateX(-50%);
      font-family: -apple-system, "SF Pro Display", BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
      font-size: clamp(0.92rem, 1.1vw, 1.05rem);
      font-weight: 600;
      letter-spacing: -0.005em;
      color: #4a4a4a;
      white-space: nowrap;
      transition: opacity 0.4s ease;
      pointer-events: none;
      text-align: center;
    }
    .carousel-label.is-fading { opacity: 0; }

    /* Arrow buttons */
    .carousel-arrow {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      width: 46px;
      height: 46px;
      border-radius: 50%;
      border: 1px solid rgba(0,0,0,0.14);
      background: rgba(255,255,255,0.7);
      -webkit-backdrop-filter: blur(8px);
      backdrop-filter: blur(8px);
      cursor: pointer;
      z-index: 5;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s, border-color 0.2s, transform 0.2s;
    }
    .carousel-arrow:hover {
      background: #111;
      border-color: #111;
      transform: translateY(-50%) scale(1.05);
    }
    .carousel-arrow:hover svg { stroke: #fff; }
    .carousel-arrow svg { width: 16px; height: 16px; stroke: #111; }
    .carousel-arrow.prev { left: 1.5rem; }
    .carousel-arrow.next { right: 1.5rem; }



    /* ─── Footer ──────────────────────────────────────────────────── */
    .design-footer {
      position: relative;
      padding: 1.2rem 3rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.83rem;
      color: rgba(0,0,0,0.5);
      border-top: 1px solid rgba(0,0,0,0.06);
      background: rgba(255,255,252,0.7);
      -webkit-backdrop-filter: blur(22px);
      backdrop-filter: blur(22px);
      z-index: 3;
    }
    .design-footer a {
      color: rgba(0,0,0,0.6);
      text-decoration: none;
      margin-left: 1.1rem;
    }
    .design-footer a:hover { color: #111; }

    /* ─── Responsive ──────────────────────────────────────────────── */
    @media (max-width: 820px) {
      .design-main { padding: 6.5rem 1rem 1.5rem; }
      .carousel { min-height: 500px; margin-top: 2rem; }
      .carousel-arrow.prev { left: 0.5rem; }
      .carousel-arrow.next { right: 0.5rem; }
      .carousel-card {
        width: 82vw;
        height: 52vw;
      }
      .design-footer { padding: 1.2rem; flex-direction: column; gap: 0.6rem; }
    }
  </style>
</head>

  <script>
  (function () {
    /* ────────────────────────────────────────────────────────────────
       Carousel — circular focus rotation
       ──────────────────────────────────────────────────────────────── */
    const stage  = document.getElementById('carouselStage');
    const cards  = Array.from(stage.querySelectorAll('.carousel-card'));
    const labelEl= document.getElementById('carouselLabel');
    const dotsEl = document.getElementById('carouselDots');
    const prevBtn= document.querySelector('.carousel-arrow.prev');
    const nextBtn= document.querySelector('.carousel-arrow.next');

    let active = 0;
    const N = cards.length;

    /* Pick the active language's label (falls back to English). */
    function labelFor(card) {
      var ko = window.i18n && window.i18n.lang === 'ko';
      return (ko && card.dataset.labelKo) ? card.dataset.labelKo : card.dataset.label;
    }
    /* Re-render the centered label when the language toggles. */
    document.addEventListener('langchange', function () {
      labelEl.textContent = labelFor(cards[active]);
    });

    /* Build dots */
    cards.forEach((c, i) => {
      const b = document.createElement('button');
      b.className = 'carousel-dot';
      b.type = 'button';
      b.setAttribute('aria-label', 'Go to ' + c.dataset.label);
      b.addEventListener('click', () => goTo(i));
      dotsEl.appendChild(b);
    });

    /* Circular 3D layout — cards orbit a vertical axis. With N=4, the cards
       sit at compass points: front, right, back (directly behind active),
       and left. Rotating just shifts which card is at which angle — they
       never sweep all the way across the screen. */
    function layout() {
      const w  = cards[0].offsetWidth || 360;
      const R  = w * 1.2;            // orbit radius — bigger = wider spread
      const half = Math.floor(N / 2);

      cards.forEach((card, i) => {
        let off = i - active;
        if (off >  half) off -= N;
        if (off < -half) off += N;

        // Position on a horizontal circle in 3D space.
        // angle 0 = front-center; positive angle swings to the right.
        const angle = (off / N) * Math.PI * 2;
        const x =  Math.sin(angle) * R;
        const z = (Math.cos(angle) - 1) * R;       // front at z=0, back at z=-2R

        // Depth in [0, 1]: 0 = front, 1 = directly behind.
        const depth = (1 - Math.cos(angle)) / 2;

        const isCenter = off === 0;
        const baseScale = 1 - depth * 0.42;        // front=1, back=0.58
        const cardScale = parseFloat(card.dataset.scale) || 1;
        const scale = baseScale * cardScale;

        // Slight inward tilt — side cards angle toward the viewer.
        const rotY = -Math.sin(angle) * 14;

        card.style.transform =
          'translate(-50%, -50%) translate3d(' + x + 'px, 0, ' + z + 'px)' +
          ' rotateY(' + rotY + 'deg) scale(' + scale + ')';

        // Fade by depth, overriding the CSS-driven opacity.
        card.style.opacity = String(1 - depth * 0.6);

        card.classList.toggle('is-active', isCenter);
        card.classList.toggle('is-far', depth > 0.7);  // applies extra grayscale to the back card
        card.style.zIndex = String(100 - Math.round(depth * 100));
      });

      /* Update label with quick fade */
      labelEl.classList.add('is-fading');
      setTimeout(() => {
        labelEl.textContent = labelFor(cards[active]);
        labelEl.classList.remove('is-fading');
      }, 180);

      /* Update dots */
      Array.from(dotsEl.children).forEach((d, i) => {
        d.classList.toggle('is-active', i === active);
      });
    }

    function goTo(i) {
      active = ((i % N) + N) % N;
      layout();
    }
    function next() { goTo(active + 1); }
    function prev() { goTo(active - 1); }

    /* Click handlers ─ side cards rotate, center card navigates */
    cards.forEach((card, i) => {
      card.addEventListener('click', (e) => {
        if (i === active) {
          window.location.href = card.dataset.page;
        } else {
          goTo(i);
        }
      });
    });

    nextBtn.addEventListener('click', next);
    prevBtn.addEventListener('click', prev);

    /* Keyboard arrows */
    document.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowRight') next();
      if (e.key === 'ArrowLeft')  prev();
      if (e.key === 'Enter') window.location.href = cards[active].dataset.page;
    });

    /* Touch swipe */
    let touchX = null;
    stage.addEventListener('touchstart', (e) => {
      touchX = e.touches[0].clientX;
    }, { passive: true });
    stage.addEventListener('touchend', (e) => {
      if (touchX == null) return;
      const dx = e.changedTouches[0].clientX - touchX;
      if (Math.abs(dx) > 40) (dx < 0 ? next() : prev());
      touchX = null;
    });

    /* Wheel — debounced so a single trackpad swipe = one move */
    let wheelLock = false;
    stage.addEventListener('wheel', (e) => {
      if (Math.abs(e.deltaX) < 12 && Math.abs(e.deltaY) < 12) return;
      if (wheelLock) return;
      wheelLock = true;
      const d = Math.abs(e.deltaX) > Math.abs(e.deltaY) ? e.deltaX : e.deltaY;
      (d > 0 ? next() : prev());
      setTimeout(() => { wheelLock = false; }, 600);
    }, { passive: true });

    window.addEventListener('resize', layout);
    layout();

    /* ────────────────────────────────────────────────────────────────
       "Paper" cursor-tilt — 3D rotation that follows the cursor on
       the active card, with a moving radial gloss for the shine.
       Inspired by justinesoulie.fr.
       ──────────────────────────────────────────────────────────────── */
    cards.forEach((card) => {
      const paper = card.querySelector('.card-paper');
      const shine = card.querySelector('.card-shine');

      let targetRX = 0, targetRY = 0;
      let rx = 0, ry = 0;
      let targetSX = 50, targetSY = 50, sx = 50, sy = 50;
      let raf = null;
      let hovering = false;

      const MAX_TILT  = 14;   // degrees
      const DAMP      = 0.12; // smoothing factor
      const LIFT_PX   = 12;   // active-card hover lift

      function loop() {
        rx += (targetRX - rx) * DAMP;
        ry += (targetRY - ry) * DAMP;
        sx += (targetSX - sx) * DAMP;
        sy += (targetSY - sy) * DAMP;

        const lift = (hovering && card.classList.contains('is-active')) ? LIFT_PX : 0;

        paper.style.transform =
          'translateY(' + (-lift) + 'px)' +
          ' rotateX(' + rx + 'deg) rotateY(' + ry + 'deg)';

        shine.style.background =
          'radial-gradient(circle at ' + sx + '% ' + sy + '%,' +
          ' rgba(255,255,255,0.45) 0%,' +
          ' rgba(255,255,255,0.18) 28%,' +
          ' rgba(255,255,255,0) 60%)';

        const settled =
          Math.abs(targetRX - rx) < 0.05 &&
          Math.abs(targetRY - ry) < 0.05 &&
          Math.abs(targetSX - sx) < 0.5  &&
          Math.abs(targetSY - sy) < 0.5;

        if (!settled || hovering) {
          raf = requestAnimationFrame(loop);
        } else {
          raf = null;
        }
      }

      function start() {
        if (!raf) raf = requestAnimationFrame(loop);
      }

      card.addEventListener('mouseenter', () => {
        if (!card.classList.contains('is-active')) return;
        hovering = true;
        start();
      });

      card.addEventListener('mousemove', (e) => {
        if (!card.classList.contains('is-active')) return;
        const r = card.getBoundingClientRect();
        const px = (e.clientX - r.left) / r.width;
        const py = (e.clientY - r.top ) / r.height;
        targetRY =  (px - 0.5) *  2 * MAX_TILT;
        targetRX = -(py - 0.5) *  2 * MAX_TILT;
        targetSX = px * 100;
        targetSY = py * 100;
        start();
      });

      card.addEventListener('mouseleave', () => {
        hovering = false;
        targetRX = 0; targetRY = 0;
        targetSX = 50; targetSY = 50;
        start();
      });
    });
  })();
  </script>
  <script src="nav.js"></script>
</body>
