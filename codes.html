<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Codes | Junho Choi</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="icon" type="image/png" href="images/logo.png" />
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="nav.css" />
  <style>
    html { scroll-behavior: smooth; }
    body { margin: 0; background: #fff; color: #111; }
    body.folder-open { overflow: hidden; }

    .site-header {
      background: transparent !important;
      border-bottom: 1px solid transparent !important;
      backdrop-filter: none;
      -webkit-backdrop-filter: none;
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 100;
      transition: background 0.35s ease, border-color 0.35s ease, backdrop-filter 0.35s ease;
    }
    .site-header .logo,
    .site-header .nav-link,
    .site-header .nav-more-toggle {
      color: rgba(0,0,0,0.78);
      text-shadow: 0 1px 10px rgba(255,255,255,0.75);
      transition: color 0.35s ease, background 0.25s ease, text-shadow 0.35s ease;
    }
    .site-header .hamburger svg {
      stroke: rgba(0,0,0,0.78);
      filter: drop-shadow(0 1px 6px rgba(255,255,255,0.75));
      transition: stroke 0.35s ease, filter 0.35s ease;
    }

    /* Zoomed state for the header navigation */
    .site-header.zoomed .logo,
    .site-header.zoomed .nav-link,
    .site-header.zoomed .nav-more-toggle {
      color: #fff;
      text-shadow: 0 1px 6px rgba(0,0,0,0.4);
    }
    .site-header.zoomed .hamburger svg {
      stroke: #fff;
      filter: drop-shadow(0 1px 4px rgba(0,0,0,0.4));
    }

    /* ══════════════════════════════════════════════════════════════════
       Stage — sticky scroll-pinned. Mockup scales up as user scrolls.
       ══════════════════════════════════════════════════════════════════ */
    .codes-stage {
      position: relative;
      height: 280vh;
      background: #fff;
    }
    .codes-pinned {
      position: sticky;
      top: 0;
      height: 100vh;
      overflow: hidden;
      background: #fff;
    }

    .mockup-wrap {
      position: absolute;
      top: 53.7%;
      left: 50%;
      width: min(82.7vw, 1300px);
      transform: translate(-50%, -50%);
    }
    .mac-mockup {
      position: relative;
      width: 100%;
      aspect-ratio: 3000 / 2250;
      transform-origin: 50% 50%;
      /* Hardware acceleration flags to fix scroll lag */
      will-change: transform;
      backface-visibility: hidden;
      transform-style: preserve-3d;
      -webkit-font-smoothing: antialiased; /* Stops text from jittering during scale */
    }
    .mockup-image {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: contain;
      pointer-events: none;
      user-select: none;
    }

    /* ══════════════════════════════════════════════════════════════════
       Folder app
       ══════════════════════════════════════════════════════════════════ */
/* The outer container (Solid dark background) */
.folder-app {
      position: absolute;
      top: 17.84%;    /* Decreased to move the top edge UP */
      left: 15.13%;   /* Decreased to move the left edge LEFT */
      width: 66.43%;  /* Increased to stretch the right edge RIGHT */
      height: 50.04%;
      z-index: 2;
      padding: 2.5% 2.5% 0 2.5%;
      display: block;
      color: #fff;
      background: #1C0730; /* Solid dark purple matching the screenshot */
      border-radius: 0.4%;
      overflow: hidden;
      backface-visibility: hidden;
      transform-style: preserve-3d;
    }

    /* NEW: The inner vibrant card layer */
    .folder-inner-card {
      position: relative;
      width: 100%;
      height: 100%;
      border-radius: 20px 20px 0 0;
      background:
        radial-gradient(circle at 18% 20%, rgba(0, 180, 255, 0.42) 0%, transparent 30%),
        radial-gradient(circle at 78% 24%, rgba(255, 45, 171, 0.52) 0%, transparent 34%),
        radial-gradient(circle at 54% 88%, rgba(255, 126, 45, 0.45) 0%, transparent 34%),
        linear-gradient(135deg, #120322 0%, #23043d 36%, #831a71 66%, #08276e 100%);
      overflow: hidden;
      box-shadow: 0 10px 40px rgba(0,0,0,0.4);
    }

    /* The glowing blur effect (Moved to the inner card) */
    .folder-inner-card::before {
      content: '';
      position: absolute;
      inset: -18%;
      background:
        radial-gradient(circle at 14% 42%, rgba(255, 0, 128, 0.26), transparent 28%),
        radial-gradient(circle at 86% 70%, rgba(51, 153, 255, 0.28), transparent 30%);
      filter: blur(22px);
      opacity: 0.9;
      pointer-events: none;
      transform: translateZ(0);
      will-change: transform, filter;
    }
    .folder-hero-text {
      position: absolute;
      top: 15%; /* Positions the text block near the top */
      left: 0;
      right: 0;
      text-align: center;
      z-index: 5;
      padding: 0 4%;
    }
    .folder-hero-text h2 {
      font-family: -apple-system, "SF Pro Display", BlinkMacSystemFont, sans-serif;
      font-size: 1.8em;
      font-weight: 700;
      color: #ffffff;
      margin: 0 0 0.3em 0;
      letter-spacing: -0.02em;
    }
    .folder-hero-text p {
      font-family: -apple-system, "SF Pro Text", sans-serif;
      font-size: 0.75em;
      font-weight: 400;
      color: rgba(255, 255, 255, 0.65);
      margin: 0;
      line-height: 1.4;
    }

    .folder-app-bar {
      position: absolute;
      top: 36%;
      left: 6%;
      right: 6%;
      z-index: 5;
      display: flex;
      align-items: center;
      justify-content: center; /* Centered Search Bar */
      gap: 1rem;
      margin-bottom: 0;
    }
    .folder-app-title {
      font-family: -apple-system, "SF Mono", Menlo, monospace;
      font-size: 0.72em;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.7);
    }
/* The Glassmorphism pill container */
.search-wrapper {
      display: flex;
      align-items: center;
      
      /* CHANGED: Reduced width and max-width to make it horizontally smaller */
      width: 30%; 
      max-width: 260px; 
      background: rgba(255, 255, 255, 0.06);
      backdrop-filter: blur(16px) saturate(180%);
      -webkit-backdrop-filter: blur(16px) saturate(180%);
      border: 1px solid rgba(255, 255, 255, 0.15);
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.25);
      border-radius: 999px;
      
      /* CHANGED: Tighter padding around the edges */
      padding: 0.15em; 
      
      transition: border-color 0.3s ease, background 0.3s ease;
      will-change: transform, backdrop-filter;
    }
    .search-wrapper:focus-within {
      border-color: rgba(255, 255, 255, 0.3);
      background: rgba(255, 255, 255, 0.09);
    }

    /* The transparent input field */
    .folder-app-search {
      flex: 1;
      background: transparent;
      border: none;
      color: #fff;
      font-family: -apple-system, "SF Pro Text", sans-serif;
      
      /* CHANGED: Smaller font size */
      font-size: 0.55em; 
      
      /* CHANGED: Thinner padding to reduce height */
      padding: 0.35em 0.5em 0.35em 1em; 
      
      outline: none;
      text-align: left;
    }
    .folder-app-search::placeholder { 
      color: rgba(255,255,255,0.4); 
    }

    /* The vibrant pink submit button */
    .search-btn {
      background: #FF0063;
      background: linear-gradient(135deg, #ff007f, #ff0033);
      color: #fff;
      border: none;
      border-radius: 999px;
      
      /* CHANGED: Reduced padding to match the new slimmer height */
      padding: 0.35em 1em; 
      
      font-family: -apple-system, "SF Pro Text", sans-serif;
      
      /* CHANGED: Smaller font size */
      font-size: 0.55em; 
      font-weight: 400;
      letter-spacing: 0.02em;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(255, 0, 85, 0.3);
      transition: transform 0.2s ease, filter 0.2s ease;
    }
    .search-btn:hover {
      transform: scale(1.03);
      filter: brightness(1.1);
    }
    .search-btn:active {
      transform: scale(0.97);
    }

    .folder-strip {
      position: absolute;
      inset: 0;
      z-index: 2;
      min-height: 0;
      margin-top: -1%;
      overflow: visible;
      cursor: grab;
      user-select: none;
      touch-action: pan-x;
      
      perspective: 1200px; /* Slightly increased for smoother 3D angles */
      
      /* THE FIX: Force the container to stack cards by z-index instead of 3D geometry */
      transform-style: flat; 
    }

    .folder-strip.dragging {
      cursor: grabbing;
    }
    .folder-tab {
      position: absolute;
      top: 85%;
      left: 50%;
      width: min(50%, 25em); 
      height: 45%; 
      
      /* Safely transparent background (no blur needed) */
      background: linear-gradient(
        135deg, 
        color-mix(in srgb, var(--panel-a) 92%, transparent), 
        color-mix(in srgb, var(--panel-b) 92%, transparent)
      );
      
      color: #fff;
      border: 1px solid rgba(255,255,255,0.26);
      padding: 1.15em 1.25em 1em;
      border-radius: 28px;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      justify-content: flex-start;
      text-align: left;
      font-family: -apple-system, "SF Pro Display", BlinkMacSystemFont, sans-serif;
      font-weight: 600;
      font-size: 0.86em;
      letter-spacing: -0.01em;
      line-height: 1.1;
      
      transform:
        translate(-50%, -50%)
        translate3d(var(--stack-x, 0), var(--stack-y, 0), var(--stack-z, 0)) 
        rotateX(var(--stack-rx, 0deg))
        rotateY(var(--stack-ry, 0deg))
        rotateZ(var(--stack-rz, 0deg))
        scale(var(--stack-scale, 1));
        
      opacity: var(--stack-opacity, 1);
      pointer-events: var(--stack-events, auto);
      
      /* CHANGED: Removed the filter transitions to speed up rendering */
      transition: transform 0.55s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.3s ease;
        
      /* THE FIX: backdrop-filter and normal filter completely removed here */
      
      overflow: hidden;
      backface-visibility: hidden;
      transform-style: flat; 
      will-change: transform; 
    }

    .folder-tab::before {
      display: none;
    }
    .folder-tab::after {
      content: '';
      position: absolute;
      left: 1.25em; bottom: 1em;
      width: 0.55em;
      height: 0.55em;
      border-radius: 50%;
      background: var(--lang-color, #999);
      box-shadow: 0 0 18px var(--lang-color, #999);
    }
    .folder-tab-title {
      position: relative;
      z-index: 1;
      max-width: 12ch;
      white-space: normal;
      text-shadow: 0 1px 18px rgba(0,0,0,0.24);
    }
    .folder-tab-meta {
      position: relative;
      z-index: 1;
      margin-top: 0.75em;
      font-family: -apple-system, "SF Mono", Menlo, monospace;
      font-size: 0.68em;
      font-weight: 500;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.72);
      opacity: 0;
      transform: translateY(0.6em);
      transition: opacity 0.25s ease, transform 0.25s ease;
    }
    .folder-tab-summary {
      position: relative;
      z-index: 1;
      max-width: 25ch;
      margin-top: auto;
      padding-bottom: 1.6em;
      color: rgba(255,255,255,0.72);
      font-family: -apple-system, "SF Pro Text", sans-serif;
      font-size: 0.7em;
      font-weight: 500;
      line-height: 1.35;
      opacity: 0;
      transform: translateY(0.6em);
      transition: opacity 0.25s ease, transform 0.25s ease;
    }
    .folder-tab.is-front {
      /* THE FIX: Increased from 30 to 100 to ensure it always renders on top */
      z-index: 100 !important; 
    
    }
    .folder-tab.is-front .folder-tab-meta,
    .folder-tab.is-front .folder-tab-summary {
      opacity: 1;
      transform: translateY(0);
    }
    .folder-strip:hover .folder-tab {
      transform:
        translate(-50%, -50%)
        translate3d(calc(var(--stack-x, 0) * 1.12), calc(var(--stack-y, 0) * 1.18), var(--stack-z, 0))
        rotateX(var(--stack-rx, 0deg))
        rotateY(calc(var(--stack-ry-num, 0) * 1deg))
        rotateZ(var(--stack-rz, 0deg))
        scale(var(--stack-scale, 1));
    }
    .folder-tab.is-front:hover {
      filter: brightness(1.07) saturate(1.12);
    }

    /* ══════════════════════════════════════════════════════════════════
       In-place zoom — the clicked card itself enlarges and centers WITHIN
       the mockup screen (folder-app), and the rest of the screen blurs.
       The actual tab element morphs (its CSS transform transitions); no
       separate detail card.
       ══════════════════════════════════════════════════════════════════ */
    .folder-app-blur {
      position: absolute;
      inset: -100%;                         /* extend past the strip to cover hero/search too */
      background: rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(22px) saturate(1.2);
      -webkit-backdrop-filter: blur(22px) saturate(1.2);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.45s ease;
      z-index: 150;
    }
    .folder-app.has-zoomed .folder-app-blur {
      opacity: 1;
      pointer-events: auto;
    }

    /* Fade and slightly blur the non-zoomed cards while one is zoomed,
       so the focused card is unmistakably the foreground. */
    .folder-app.has-zoomed .folder-tab:not(.is-zoomed) {
      opacity: 0.18;
      filter: blur(4px);
      pointer-events: none;
    }
    /* Dim the hero text and search bar at the top of the screen while
       a card is zoomed — keeps focus on the open project. */
    .folder-app.has-zoomed .folder-hero-text,
    .folder-app.has-zoomed .folder-app-bar {
      opacity: 0.18;
      filter: blur(4px);
      pointer-events: none;
      transition: opacity 0.4s, filter 0.4s;
    }
    .folder-hero-text,
    .folder-app-bar {
      transition: opacity 0.4s, filter 0.4s;
    }

    /* When a tab is in its zoomed state, override the 3D stack transform
       and pin it to the center of the strip at a larger size. CSS transition
       on transform/width/height plays the morph from the coverflow position. */
    .folder-tab.is-zoomed {
      width: min(82%, 42em) !important;
      height: 80% !important;
      top: 50% !important;
      left: 50% !important;
      transform: translate(-50%, -50%) !important;
      z-index: 200 !important;
      pointer-events: auto !important;
      cursor: default !important;
      box-shadow:
        0 30px 80px rgba(0, 0, 0, 0.45),
        0 0 0 1px rgba(255, 255, 255, 0.18) inset;
    }
    .folder-tab.is-zoomed .folder-tab-meta,
    .folder-tab.is-zoomed .folder-tab-summary {
      opacity: 1 !important;
      transform: translateY(0) !important;
    }

    /* Close button — visible only when the tab is zoomed */
    .folder-tab-close {
      position: absolute;
      top: 0.7em;
      right: 0.7em;
      width: 2em;
      height: 2em;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.15);
      border: 1px solid rgba(255, 255, 255, 0.3);
      color: #fff;
      font-size: 1.05em;
      line-height: 1;
      cursor: pointer;
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 5;
      font-family: -apple-system, sans-serif;
      transition: background 0.2s, transform 0.2s;
    }
    .folder-tab.is-zoomed .folder-tab-close {
      display: flex;
    }
    .folder-tab-close:hover {
      background: rgba(255, 255, 255, 0.28);
      transform: rotate(90deg);
    }

    /* "View on GitHub" link — visible only when the tab is zoomed */
    .folder-tab-repo {
      display: none;
      align-items: center;
      gap: 0.45em;
      padding: 0.55em 1.1em;
      background: rgba(0, 0, 0, 0.45);
      color: #fff;
      border: 1px solid rgba(255, 255, 255, 0.25);
      border-radius: 999px;
      text-decoration: none;
      font-size: 0.7em;
      font-weight: 500;
      font-family: -apple-system, "SF Pro Text", sans-serif;
      letter-spacing: 0.01em;
      margin-top: 1.2em;
      align-self: flex-start;
      transition: transform 0.2s, background 0.2s;
      position: relative;
      z-index: 2;
    }
    .folder-tab.is-zoomed .folder-tab-repo {
      display: inline-flex;
    }
    .folder-tab-repo:hover {
      background: rgba(0, 0, 0, 0.65);
      transform: translateY(-2px);
    }
    .folder-tab-repo svg {
      width: 1.05em;
      height: 1.05em;
      fill: currentColor;
    }

    /* Smooth the morph for size changes — transform was already transitioned
       in the original .folder-tab rule, so we add width/height here. */
    .folder-tab {
      transition: transform 0.55s cubic-bezier(0.22, 1, 0.36, 1),
                  width    0.55s cubic-bezier(0.22, 1, 0.36, 1),
                  height   0.55s cubic-bezier(0.22, 1, 0.36, 1),
                  opacity  0.3s ease;
    }

    /* ══════════════════════════════════════════════════════════════════
       Legacy detail panel (no longer used — kept hidden for safety)
       ══════════════════════════════════════════════════════════════════ */
    .folder-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(255,255,255,0.35);
      backdrop-filter: blur(28px) saturate(1.2);
      -webkit-backdrop-filter: blur(28px) saturate(1.2);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.45s ease;
      z-index: 800;
    }
    body.folder-open .folder-backdrop {
      opacity: 1;
      pointer-events: auto;
    }

    /* Detail panel — positioned/animated entirely via inline styles in JS so
       the FLIP morph from the clicked tab is precise. The CSS just provides
       the resting visual style (white card, rounded, big shadow). */
    .folder-detail {
      position: fixed;
      top: 50%; left: 50%;
      width: min(640px, 86vw);
      max-height: 80vh;
      transform: translate(-50%, -50%) scale(0.92);
      opacity: 0;
      pointer-events: none;
      z-index: 900;
      background: #fff;
      border-radius: 18px;
      box-shadow: 0 40px 100px rgba(0,0,0,0.28), 0 8px 24px rgba(0,0,0,0.12);
      padding: 2.4rem 2.6rem 2.2rem;
      overflow-y: auto;
      transform-origin: center center;
      will-change: transform, opacity;
    }
    .folder-detail::before {
      content: '';
      position: absolute;
      top: -1px; left: 32px;
      width: 110px; height: 14px;
      background: #fff;
      border-radius: 8px 8px 0 0;
      box-shadow: 0 -2px 6px rgba(0,0,0,0.06);
    }
    .folder-detail-close {
      position: absolute;
      top: 18px; right: 22px;
      width: 36px; height: 36px;
      border-radius: 50%;
      background: rgba(0,0,0,0.05);
      border: 1px solid rgba(0,0,0,0.08);
      font-size: 1.3rem;
      line-height: 1;
      color: #111;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s, transform 0.2s;
    }
    .folder-detail-close:hover { background: rgba(0,0,0,0.1); transform: rotate(90deg); }

    .detail-tag {
      font-family: -apple-system, "SF Mono", Menlo, monospace;
      font-size: 0.72rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: #888;
      display: block;
      margin: 0.4rem 0 0.6rem;
    }
    .detail-title {
      font-family: -apple-system, "SF Pro Display", BlinkMacSystemFont, sans-serif;
      font-size: clamp(1.7rem, 3vw, 2.4rem);
      font-weight: 600;
      letter-spacing: -0.03em;
      line-height: 1.05;
      margin: 0 0 1.1rem;
    }
    .detail-desc {
      font-family: -apple-system, "SF Pro Text", sans-serif;
      font-size: 1rem;
      line-height: 1.6;
      color: #333;
      margin: 0 0 1.5rem;
    }
    .detail-desc strong { color: #111; font-weight: 600; }
    .detail-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 0.45rem;
      margin-bottom: 1.8rem;
    }
    .detail-tags span {
      font-family: -apple-system, "SF Mono", Menlo, monospace;
      font-size: 0.72rem;
      letter-spacing: 0.06em;
      color: #444;
      border: 1px solid rgba(0,0,0,0.18);
      border-radius: 999px;
      padding: 0.32rem 0.85rem;
      background: #fafafa;
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
    }
    .detail-tags span::before {
      content: '';
      width: 8px; height: 8px;
      border-radius: 50%;
      background: var(--lang-color, #999);
    }
    .detail-repo {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.85rem 1.7rem;
      background: #111;
      color: #fff;
      border-radius: 999px;
      text-decoration: none;
      font-family: -apple-system, "SF Pro Text", sans-serif;
      font-size: 0.92rem;
      font-weight: 500;
      transition: transform 0.2s, background 0.2s;
    }
    .detail-repo:hover { background: #000; transform: translateY(-2px); }
    .detail-repo svg { width: 16px; height: 16px; fill: currentColor; }

    /* Responsive */
    @media (max-width: 900px) {
      .codes-stage { height: 260vh; }
      .display { width: clamp(320px, 86vw, 520px); }
      .mac-studio-cube { display: none; }
    }

    /* Phones: the Mac-mockup + scroll-zoom metaphor doesn't fit a narrow
       screen (the "display" ends up ~200px wide with unreadable text).
       Drop the hardware frame and let the folder app fill the viewport
       below the header as a single full-screen panel. */
    @media (max-width: 700px) {
      .codes-stage { height: auto; }
      .codes-pinned {
        position: relative;
        height: 100vh;
        height: 100svh;
      }
      .mockup-wrap {
        position: absolute;
        inset: 0;
        top: 0; left: 0;
        width: 100%;
        transform: none;
      }
      .mac-mockup {
        width: 100%;
        height: 100%;
        aspect-ratio: auto;
        transform: none !important;
      }
      .mockup-image { display: none; }
      .folder-app {
        top: 58px;
        left: 0;
        width: 100%;
        height: calc(100% - 58px);
        padding: 0.9rem 0.7rem 0;
        border-radius: 0;
      }
      .folder-hero-text { top: 5%; }
      .folder-hero-text h2 { font-size: 1.45em; }
      .folder-hero-text p { font-size: 0.8em; }
      .folder-app-bar { top: 17%; }
      .search-wrapper { width: 86%; max-width: 340px; }
      .folder-app-search { font-size: 16px; padding: 0.3em 0.5em 0.3em 1em; } /* ≥16px stops iOS focus zoom */
      .search-btn { font-size: 0.8em; }
      .folder-tab {
        font-size: 1em;
        top: 64%;
        width: min(76%, 19em);
        height: 40%;
      }
      .folder-tab.is-zoomed {
        width: 94% !important;
        height: 72% !important;
        top: 54% !important;
      }
    }
  </style>
</head>
<body>

  <div class="codes-stage" id="codesStage">

            <!-- NEW: The inner vibrant card -->

              <div class="folder-hero-text">

  <script>
    (function () {
      const PROJECTS = [
        { name: 'Portfolio-site',   repo: 'https://github.com/andrewcjh27/Portfolio-site',
          desc: 'This very site — a minimal portfolio built from scratch with vanilla HTML/CSS, Three.js for the interactive room tour, and scroll-driven animations.',
          tags: [['HTML','#e34c26'],['CSS','#264de4'],['JavaScript','#f1e05a'],['Three.js','#049ef4']] },
        { name: 'Heart-Disease-ML', repo: 'https://github.com/andrewcjh27/Heart-Disease-ML',
          desc: 'Machine learning project for heart disease prediction — data exploration, feature engineering, and model evaluation using Jupyter Notebooks.',
          tags: [['Jupyter','#da5b0b'],['Python','#3572A5']] },
        { name: 'CS61B',            repo: 'https://github.com/andrewcjh27/CS61B',
          desc: 'Data structures and algorithms coursework from UC Berkeley’s CS 61B — implementations of core data structures, sorting algorithms, and graph algorithms.',
          tags: [['Java','#b07219']] },
        { name: 'rad-DINO',         repo: 'https://github.com/andrewcjh27/rad-DINO',
          desc: 'Implementation and experiments with the RAD-DINO model — a self-supervised vision transformer for radiology image analysis and representation learning.',
          tags: [['Python','#3572A5']] },
        { name: '3D-Unet',          repo: 'https://github.com/andrewcjh27/3D-Unet',
          desc: '3D U-Net architecture for volumetric medical image segmentation — a deep-learning model for processing and analyzing 3D medical scans.',
          tags: [['Python','#3572A5']] },
        { name: 'Java-game',        repo: 'https://github.com/andrewcjh27/Java-game',
          desc: 'A game built in Java — exploring object-oriented design patterns, game loops, and interactive graphics programming.',
          tags: [['Java','#b07219']] },
        { name: 'NotesLab',         repo: 'https://github.com/andrewcjh27/NotesLab',
          desc: 'A note-taking iOS app built with Swift — clean UI, local storage, and intuitive organization for capturing ideas on the go.',
          tags: [['Swift','#F05138']] },
        { name: 'Data100',          repo: 'https://github.com/andrewcjh27/Data100',
          desc: 'Coursework from UC Berkeley’s Data 100 — data science principles covering EDA, feature engineering, modeling, and statistical inference.',
          tags: [['Jupyter','#da5b0b'],['Python','#3572A5']] },
        { name: 'Todo-Widget',      repo: 'https://github.com/andrewcjh27/Todo-Widget',
          desc: 'A native iOS home-screen widget for managing to-dos — built with SwiftUI and WidgetKit for quick task capture and at-a-glance progress.',
          tags: [['Swift','#F05138']] },
        { name: 'Soccer-AI',        repo: 'https://github.com/andrewcjh27/Soccer-AI',
          desc: 'AI-powered soccer simulation — a neural network "soccer brain" that learns player positioning, game strategy, and route optimization through reinforcement learning.',
          tags: [['Python','#3572A5']] }
      ];

      const strip = document.getElementById('folderStrip');
      const PANEL_GRADIENTS = [
        ['#ff2f91', '#315bff'],
        ['#00c2ff', '#8b35ff'],
        ['#ff8a25', '#ff2db2'],
        ['#5d4dff', '#0dd3ff'],
        ['#f12b91', '#661dff']
      ];
      PROJECTS.forEach((p, i) => {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'folder-tab';
        btn.dataset.i = String(i);
        btn.dataset.name = p.name.toLowerCase();
        btn.style.zIndex = String(PROJECTS.length - i);
        btn.style.setProperty('--lang-color', p.tags[0][1]);
        btn.style.setProperty('--panel-a', PANEL_GRADIENTS[i % PANEL_GRADIENTS.length][0]);
        btn.style.setProperty('--panel-b', PANEL_GRADIENTS[i % PANEL_GRADIENTS.length][1]);
        const title = document.createElement('span');
        title.className = 'folder-tab-title';
        title.textContent = p.name;
        const meta = document.createElement('span');
        meta.className = 'folder-tab-meta';
        meta.textContent = p.tags.map(([tag]) => tag).join(' / ');
        const summary = document.createElement('span');
        summary.className = 'folder-tab-summary';
        summary.textContent = p.desc;

        // Close button — only visible when the tab is in its zoomed state.
        const close = document.createElement('button');
        close.type = 'button';
        close.className = 'folder-tab-close';
        close.setAttribute('aria-label', 'Close project');
        close.textContent = '×';

        // "View on GitHub" link — only visible when the tab is zoomed.
        const repo = document.createElement('a');
        repo.className = 'folder-tab-repo';
        repo.href = p.repo;
        repo.target = '_blank';
        repo.rel = 'noopener';
        repo.innerHTML =
          '<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"/></svg>' +
          '<span>View on GitHub</span>';

        btn.append(close, title, meta, summary, repo);
        strip.appendChild(btn);
      });
      let dragStartX = 0;
      let didDragFolder = false;
      let activeFolderIndex = 0;

      function visibleFolderIndexes() {
        return PROJECTS
          .map((_, i) => i)
          .filter(i => {
            const tab = document.querySelector(`.folder-tab[data-i="${i}"]`);
            return tab && tab.style.display !== 'none';
          });
      }

      function setStackProp(tab, x, y, z, scale, rz, ry, opacity, zIndex, events) {
        tab.style.setProperty('--stack-x', x);
        tab.style.setProperty('--stack-y', y);
        tab.style.setProperty('--stack-z', z);
        tab.style.setProperty('--stack-scale', scale);
        tab.style.setProperty('--stack-rz', rz);
        tab.style.setProperty('--stack-ry', ry);
        tab.style.setProperty('--stack-ry-num', parseFloat(ry) || 0);
        tab.style.setProperty('--stack-opacity', opacity);
        tab.style.setProperty('--stack-brightness', String(0.88 + Math.min(Number(scale), 1) * 0.12));
        tab.style.setProperty('--stack-saturate', String(0.9 + Math.min(Number(scale), 1) * 0.18));
        tab.style.setProperty('--stack-events', events);
        tab.style.zIndex = String(zIndex);
      }

      function updateStack() {
        const tabs = Array.from(document.querySelectorAll('.folder-tab'))
          .filter(t => t.style.display !== 'none');
        if (!tabs.length) return;
        const visible = visibleFolderIndexes();
        if (!visible.includes(activeFolderIndex)) activeFolderIndex = visible[0];
        const activePosition = visible.indexOf(activeFolderIndex);
        const layerStyles = {
          0:  ['0%', '4%', '70px', '1', '0deg', '0deg', '1', 80, 'auto'],
          1:  ['12%', '-10%', '28px', '0.92', '2.5deg', '-8deg', '0.92', 60, 'auto'],
          '-1':['-13%', '-12%', '18px', '0.9', '-2.5deg', '9deg', '0.9', 58, 'auto'],
          2:  ['22%', '-21%', '-8px', '0.82', '5deg', '-14deg', '0.78', 40, 'none'],
          '-2':['-24%', '-22%', '-14px', '0.8', '-5deg', '14deg', '0.76', 38, 'none'],
          3:  ['31%', '-31%', '-36px', '0.72', '7deg', '-18deg', '0.56', 24, 'none'],
          '-3':['-33%', '-32%', '-44px', '0.7', '-7deg', '18deg', '0.52', 22, 'none']
        };
        tabs.forEach(tab => {
          tab.classList.remove('is-front');
          setStackProp(tab, '0%', '16%', '-80px', '0.68', '0deg', '0deg', '0', 1, 'none');
        });
        [0, 1, -1, 2, -2, 3, -3].forEach(offset => {
          const wrapped = (activePosition + offset + visible.length) % visible.length;
          const tab = document.querySelector(`.folder-tab[data-i="${visible[wrapped]}"]`);
          if (!tab) return;
          setStackProp(tab, ...layerStyles[offset]);
          if (offset === 0) tab.classList.add('is-front');
        });
      }

      strip.addEventListener('pointerdown', e => {
        if (e.button !== 0) return;
        dragStartX = e.clientX;
        didDragFolder = false;
        strip.classList.add('dragging');
        strip.setPointerCapture(e.pointerId);
      });
      strip.addEventListener('pointermove', e => {
        if (!strip.classList.contains('dragging')) return;
        const dx = e.clientX - dragStartX;
        // 12px threshold — any real click stays well under this, only an
        // intentional swipe trips it. Smaller values were eating clicks
        // because mice/trackpads jitter 1-5px during a normal click.
        if (Math.abs(dx) > 12) didDragFolder = true;
        if (Math.abs(dx) > 48) {
          const visible = visibleFolderIndexes();
          if (visible.length) {
            const current = visible.indexOf(activeFolderIndex);
            const direction = dx < 0 ? 1 : -1;
            activeFolderIndex = visible[(current + direction + visible.length) % visible.length];
            dragStartX = e.clientX;
            updateStack();
          }
        }
      });
      function endFolderDrag(e) {
        if (!strip.classList.contains('dragging')) return;
        strip.classList.remove('dragging');
        if (strip.hasPointerCapture(e.pointerId)) strip.releasePointerCapture(e.pointerId);
        const visible = visibleFolderIndexes();
        if (didDragFolder && visible.length) {
          const current = visible.indexOf(activeFolderIndex);
          const direction = e.clientX < dragStartX ? 1 : -1;
          activeFolderIndex = visible[(current + direction + visible.length) % visible.length];
        }
        requestAnimationFrame(updateStack);
      }
      strip.addEventListener('pointerup', endFolderDrag);
      strip.addEventListener('pointercancel', endFolderDrag);
      requestAnimationFrame(updateStack);

      // ── Scroll-driven mockup scale ─────────────────────────────────
      const stage     = document.getElementById('codesStage');
      const mockup    = document.getElementById('macMockup');
      const folderApp = document.getElementById('folderApp');
      const header    = document.getElementById('siteHeader'); 
      let ticking = false;
      
      // Cached layout variables to prevent frame drops
      let maxScale = 1;
      let cachedTotalScroll = 0;
      let cachedVh = 0;
      let cachedStageTop = 0;

      // Matches the phone breakpoint in the CSS above — there the folder
      // app fills the viewport and the scroll-zoom must not run.
      const MOBILE_MQ = window.matchMedia('(max-width: 700px)');

      const SCREEN_TOP_PCT    = 19.3;
      const SCREEN_LEFT_PCT   = 15.13;
      const SCREEN_WIDTH_PCT  = 66.43;
      const SCREEN_HEIGHT_PCT = 50.04;
      const SCREEN_CX_PCT     = SCREEN_LEFT_PCT + SCREEN_WIDTH_PCT  / 2;
      const SCREEN_CY_PCT     = SCREEN_TOP_PCT  + SCREEN_HEIGHT_PCT / 2;
      const SCREEN_OVERSCAN   = 1.035;
      const TARGET_TX_PCT = 50 - SCREEN_CX_PCT;
      const TARGET_TY_PCT = 50 - SCREEN_CY_PCT;

      // Run this ONLY on load and resize, never during scroll
      function cacheLayout() {
        const prev = mockup.style.transform;
        mockup.style.transform = '';
        const rect = folderApp.getBoundingClientRect();
        mockup.style.transform = prev;
        
        cachedVh = window.innerHeight;
        cachedTotalScroll = stage.offsetHeight - cachedVh;
        
        // Get absolute position of the stage from the top of the document
        const stageRect = stage.getBoundingClientRect();
        cachedStageTop = stageRect.top + window.scrollY;

        if (!rect.width || !rect.height) {
          maxScale = 1;
          return;
        }

        const navHeight = 80;
        const availableHeight = cachedVh - navHeight;
        const sx = window.innerWidth  / rect.width;
        const sy = availableHeight / rect.height;
        maxScale = Math.max(sx, sy) * SCREEN_OVERSCAN;
      }

      function update() {
        if (MOBILE_MQ.matches) {
          mockup.style.transform = '';
          header.classList.remove('zoomed');
          ticking = false;
          return;
        }
        // Use cheap window.scrollY instead of expensive getBoundingClientRect()
        const scrolledIntoStage = window.scrollY - cachedStageTop;
        const rawProgress = scrolledIntoStage / cachedTotalScroll;
        
        const progress = Math.max(0, Math.min(1, rawProgress));
        const zoomProgress = Math.min(1, progress * (cachedTotalScroll / cachedVh));
        const scale = 1 + zoomProgress * (maxScale - 1);

        const tx = zoomProgress * TARGET_TX_PCT;
        const ty = zoomProgress * TARGET_TY_PCT;
        const yOffset = zoomProgress * (40); // Half of nav height (80/2)

        mockup.style.transform = `translate3d(0, ${yOffset}px, 0) scale(${scale}) translate3d(${tx}%, ${ty}%, 0)`;

        if (zoomProgress > 0.85) {
          header.classList.add('zoomed');
        } else {
          header.classList.remove('zoomed');
        }

        ticking = false;
      }

      function onScroll() {
        if (!ticking) {
          window.requestAnimationFrame(update);
          ticking = true;
        }
      }

      window.addEventListener('scroll', onScroll, { passive: true });
      window.addEventListener('resize', () => { cacheLayout(); onScroll(); }, { passive: true });

      const mockupImg = document.querySelector('.mockup-image');
      function init() { cacheLayout(); update(); }
      if (mockupImg && !mockupImg.complete) {
        mockupImg.addEventListener('load', init, { once: true });
      } else {
        requestAnimationFrame(init);
      }

      // ── Search filter ──────────────────────────────────────────────
      const search = document.getElementById('projectSearch');
      search.addEventListener('input', () => {
        const q = search.value.trim().toLowerCase();
        document.querySelectorAll('.folder-tab').forEach(t => {
          const hit = !q || t.dataset.name.indexOf(q) !== -1;
          t.style.display = hit ? '' : 'none';
        });
        const visible = visibleFolderIndexes();
        activeFolderIndex = visible.length ? visible[0] : 0;
        requestAnimationFrame(updateStack);
      });
      search.addEventListener('keydown', e => e.stopPropagation());

      // ── Folder click → zoom to front ───────────────────────────────
      const backdrop  = document.getElementById('folderBackdrop');
      const detail    = document.getElementById('folderDetail');
      const detailInn = document.getElementById('folderDetailInner');
      const detailClose = document.getElementById('folderDetailClose');

      // The currently-zoomed tab, so closeFolder() can find it again.
      let _zoomedTab = null;

      // The clicked tab itself becomes the zoomed card — no separate detail
       // panel. CSS .is-zoomed overrides its 3D-stack transform to center
       // and enlarge it within the mockup's screen area (folder-app).
      function openFolder(idx, tabEl) {
        if (!tabEl) tabEl = document.querySelector('.folder-tab[data-i="' + idx + '"]');
        if (!tabEl) return;
        // Clear any previous zoom first
        const prev = document.querySelector('.folder-tab.is-zoomed');
        if (prev && prev !== tabEl) prev.classList.remove('is-zoomed');
        tabEl.classList.add('is-zoomed');
        folderApp.classList.add('has-zoomed');
        _zoomedTab = tabEl;
      }

      function closeFolder() {
        if (_zoomedTab) {
          _zoomedTab.classList.remove('is-zoomed');
          _zoomedTab = null;
        } else {
          document.querySelectorAll('.folder-tab.is-zoomed').forEach(t => t.classList.remove('is-zoomed'));
        }
        folderApp.classList.remove('has-zoomed');
      }

      // The blur overlay inside the screen is what catches outside-clicks.
      const folderAppBlur = document.getElementById('folderAppBlur');
      if (folderAppBlur) folderAppBlur.addEventListener('click', closeFolder);

      strip.addEventListener('click', e => {
        if (didDragFolder) {
          didDragFolder = false;
          return;
        }
        // Close button inside the currently-zoomed tab → close.
        if (e.target.closest('.folder-tab-close')) {
          closeFolder();
          return;
        }
        // GitHub link → let default navigation happen (opens in new tab).
        if (e.target.closest('.folder-tab-repo')) return;

        // Because pointer capture re-targets pointerup/click to the capturing
        // element (.folder-strip), e.target is usually the strip itself rather
        // than the clicked tab. Look up the real element at the cursor
        // position to find which tab was actually clicked.
        const hit = document.elementFromPoint(e.clientX, e.clientY);
        const tab = (hit && hit.closest('.folder-tab')) ||
                    e.target.closest('.folder-tab');
        if (!tab) return;
        // Clicking a tab that's already zoomed does nothing — close via × or
        // backdrop or Esc.
        if (tab.classList.contains('is-zoomed')) return;
        const i = parseInt(tab.dataset.i, 10);
        if (!isNaN(i)) openFolder(i, tab);
      });
      window.addEventListener('keydown', e => {
        if (e.key === 'Escape' && folderApp.classList.contains('has-zoomed')) closeFolder();
      });

    })();
  </script>
