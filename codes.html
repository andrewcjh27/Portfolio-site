<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Codes | Junho Choi</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="icon" type="image/png" href="images/logo.png" />
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="nav.css" />
  <style>
    html { scroll-behavior: smooth; }
    body { margin: 0; background: #fff; color: #111; }
    body.folder-open { overflow: hidden; }

    .site-header {
      background: transparent !important;
      border-bottom: 1px solid transparent !important;
      backdrop-filter: none;
      -webkit-backdrop-filter: none;
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 100;
      transition: background 0.35s ease, border-color 0.35s ease, backdrop-filter 0.35s ease;
    }
    .site-header .logo,
    .site-header .nav-link,
    .site-header .nav-more-toggle {
      color: rgba(0,0,0,0.78);
      text-shadow: 0 1px 10px rgba(255,255,255,0.75);
      transition: color 0.35s ease, background 0.25s ease;
    }
    .site-header .hamburger svg {
      stroke: rgba(0,0,0,0.78);
      filter: drop-shadow(0 1px 6px rgba(255,255,255,0.75));
      transition: stroke 0.35s ease;
    }

    /* ══════════════════════════════════════════════════════════════════
       Stage — sticky scroll-pinned. Mockup scales up as user scrolls.
       ══════════════════════════════════════════════════════════════════ */
    .codes-stage {
      position: relative;
      /* 0–vh: zoom transition. vh–end: folder app interactive while pinned. */
      height: 280vh;
      background: #fff;
    }
    .codes-pinned {
      position: sticky;
      top: 0;
      height: 100vh;
      overflow: hidden;
      background: #fff;
    }

    /* Two-element setup so centering (translate) and scaling (scale) don't
       fight over the single 'transform' property.
       .mockup-wrap stays centered in the pinned viewport.
       .mac-mockup inside it is scaled by JS via the transform property. */
    .mockup-wrap {
      position: absolute;
      top: 50%;
      left: 50%;
      width: min(88vw, 1500px);
      transform: translate(-50%, -50%);
    }
    .mac-mockup {
      position: relative;
      width: 100%;
      aspect-ratio: 3000 / 2250;   /* matches the PNG: 4:3 */
      /* Scale around the mockup's center. The JS-applied transform combines
         scale + translate so the screen rect ends up exactly at viewport
         center at full zoom (despite being off-center within the mockup). */
      transform-origin: 50% 50%;
      will-change: transform;
    }
    .mockup-image {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: contain;
      pointer-events: none;
      user-select: none;
    }

    /* ══════════════════════════════════════════════════════════════════
       Folder app — positioned over the white screen area of the PNG.
       Tightened so the dark bezel/frame of the Studio Display is visible
       around the screen content. Adjust if the screen rectangle in your
       PNG is different — these are the four numbers to tune.
       ══════════════════════════════════════════════════════════════════ */
    .folder-app {
      position: absolute;
      /* Pixel-measured from the actual PNG (3000×2250):
         top=406, left=460, right=2441, bottom=1523. */
      top: 18.04%;
      left: 15.33%;
      width: 66.03%;
      height: 49.64%;
      z-index: 2;
      padding: 2.5% 3%;
      display: block;
      color: #fff;
      background:
        radial-gradient(circle at 18% 20%, rgba(0, 180, 255, 0.42) 0%, transparent 30%),
        radial-gradient(circle at 78% 24%, rgba(255, 45, 171, 0.52) 0%, transparent 34%),
        radial-gradient(circle at 54% 88%, rgba(255, 126, 45, 0.45) 0%, transparent 34%),
        linear-gradient(135deg, #120322 0%, #23043d 36%, #831a71 66%, #08276e 100%);
      border-radius: 0.4%;
      overflow: hidden;
    }
    .folder-app::before {
      content: '';
      position: absolute;
      inset: -18%;
      background:
        radial-gradient(circle at 14% 42%, rgba(255, 0, 128, 0.26), transparent 28%),
        radial-gradient(circle at 86% 70%, rgba(51, 153, 255, 0.28), transparent 30%);
      filter: blur(22px);
      opacity: 0.9;
      pointer-events: none;
    }
    .folder-app-bar {
      position: absolute;
      top: 6%;
      left: 6%;
      right: 6%;
      z-index: 5;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      margin-bottom: 0;
    }
    .folder-app-title {
      font-family: -apple-system, "SF Mono", Menlo, monospace;
      font-size: 0.72em;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.7);
    }
    .folder-app-search {
      width: 38%;
      padding: 0.45em 0.9em;
      border-radius: 999px;
      border: 1px solid rgba(255,255,255,0.18);
      background: rgba(255,255,255,0.08);
      color: #fff;
      font-family: -apple-system, "SF Pro Text", sans-serif;
      font-size: 0.6em;
      outline: none;
    }
    .folder-app-search::placeholder { color: rgba(255,255,255,0.5); }
    .folder-app-search:focus { background: rgba(255,255,255,0.15); border-color: rgba(255,255,255,0.4); }

    .folder-strip {
      position: absolute;
      inset: 0;
      z-index: 2;
      min-height: 0;
      margin-top: -1%;
      overflow: visible;
      cursor: grab;
      user-select: none;
      touch-action: pan-x;
      perspective: 900px;
      transform-style: preserve-3d;
    }
    .folder-strip.dragging {
      cursor: grabbing;
    }
    .folder-tab {
      position: absolute;
      top: 62%;
      left: 50%;
      width: min(78%, 34em);
      height: 58%;
      background:
        linear-gradient(145deg, rgba(255,255,255,0.34), rgba(255,255,255,0.11)),
        radial-gradient(circle at 18% 8%, rgba(255,255,255,0.42), transparent 26%),
        linear-gradient(135deg, var(--panel-a, #ff2f91), var(--panel-b, #3f63ff));
      color: #fff;
      border: 1px solid rgba(255,255,255,0.26);
      padding: 1.15em 1.25em 1em;
      border-radius: 28px;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      justify-content: flex-start;
      text-align: left;
      font-family: -apple-system, "SF Pro Display", BlinkMacSystemFont, sans-serif;
      font-weight: 600;
      font-size: 0.86em;
      letter-spacing: -0.01em;
      line-height: 1.1;
      transform:
        translate(-50%, -50%)
        translate3d(var(--stack-x, 0), var(--stack-y, 0), var(--stack-z, 0))
        rotateX(var(--stack-rx, 0deg))
        rotateY(var(--stack-ry, 0deg))
        rotateZ(var(--stack-rz, 0deg))
        scale(var(--stack-scale, 1));
      opacity: var(--stack-opacity, 1);
      pointer-events: var(--stack-events, auto);
      transition:
        transform 0.55s cubic-bezier(0.22, 1, 0.36, 1),
        opacity 0.3s ease,
        box-shadow 0.35s ease,
        filter 0.35s ease;
      box-shadow:
        0 28px 70px rgba(0,0,0,0.38),
        0 0 42px rgba(255,40,170,0.22),
        inset 0 1px 0 rgba(255,255,255,0.42);
      backdrop-filter: blur(18px) saturate(1.24);
      -webkit-backdrop-filter: blur(18px) saturate(1.24);
      filter: saturate(var(--stack-saturate, 1)) brightness(var(--stack-brightness, 1));
      overflow: hidden;
    }
    .folder-tab::before {
      content: '';
      position: absolute;
      inset: 0;
      background:
        linear-gradient(90deg, rgba(255,255,255,0.28), transparent 38%),
        radial-gradient(circle at 90% 8%, rgba(255,255,255,0.32), transparent 22%);
      pointer-events: none;
    }
    .folder-tab::after {
      content: '';
      position: absolute;
      left: 1.25em; bottom: 1em;
      width: 0.55em;
      height: 0.55em;
      border-radius: 50%;
      background: var(--lang-color, #999);
      box-shadow: 0 0 18px var(--lang-color, #999);
    }
    .folder-tab-title {
      position: relative;
      z-index: 1;
      max-width: 12ch;
      white-space: normal;
      text-shadow: 0 1px 18px rgba(0,0,0,0.24);
    }
    .folder-tab-meta {
      position: relative;
      z-index: 1;
      margin-top: 0.75em;
      font-family: -apple-system, "SF Mono", Menlo, monospace;
      font-size: 0.68em;
      font-weight: 500;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.72);
      opacity: 0;
      transform: translateY(0.6em);
      transition: opacity 0.25s ease, transform 0.25s ease;
    }
    .folder-tab-summary {
      position: relative;
      z-index: 1;
      max-width: 25ch;
      margin-top: auto;
      padding-bottom: 1.6em;
      color: rgba(255,255,255,0.72);
      font-family: -apple-system, "SF Pro Text", sans-serif;
      font-size: 0.7em;
      font-weight: 500;
      line-height: 1.35;
      opacity: 0;
      transform: translateY(0.6em);
      transition: opacity 0.25s ease, transform 0.25s ease;
    }
    .folder-tab.is-front {
      z-index: 30 !important;
      box-shadow:
        0 36px 90px rgba(0,0,0,0.48),
        0 0 54px rgba(255,45,171,0.34),
        0 0 90px rgba(0,180,255,0.18),
        inset 0 1px 0 rgba(255,255,255,0.48);
    }
    .folder-tab.is-front .folder-tab-meta,
    .folder-tab.is-front .folder-tab-summary {
      opacity: 1;
      transform: translateY(0);
    }
    .folder-strip:hover .folder-tab {
      transform:
        translate(-50%, -50%)
        translate3d(calc(var(--stack-x, 0) * 1.12), calc(var(--stack-y, 0) * 1.18), var(--stack-z, 0))
        rotateX(var(--stack-rx, 0deg))
        rotateY(calc(var(--stack-ry-num, 0) * 1deg))
        rotateZ(var(--stack-rz, 0deg))
        scale(var(--stack-scale, 1));
    }
    .folder-tab.is-front:hover {
      filter: brightness(1.07) saturate(1.12);
    }

    /* ══════════════════════════════════════════════════════════════════
       Active-folder mode — clicked folder zooms forward
       ══════════════════════════════════════════════════════════════════ */
    .folder-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(255,255,255,0.35);
      backdrop-filter: blur(28px) saturate(1.2);
      -webkit-backdrop-filter: blur(28px) saturate(1.2);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.45s ease;
      z-index: 800;
    }
    body.folder-open .folder-backdrop {
      opacity: 1;
      pointer-events: auto;
    }

    .folder-detail {
      position: fixed;
      top: 50%; left: 50%;
      width: min(640px, 86vw);
      max-height: 80vh;
      transform: translate(-50%, -50%) scale(0.92);
      opacity: 0;
      pointer-events: none;
      z-index: 900;
      background: #fff;
      border-radius: 18px;
      box-shadow: 0 40px 100px rgba(0,0,0,0.28), 0 8px 24px rgba(0,0,0,0.12);
      padding: 2.4rem 2.6rem 2.2rem;
      overflow-y: auto;
      transition: transform 0.45s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.35s ease;
    }
    body.folder-open .folder-detail {
      transform: translate(-50%, -50%) scale(1);
      opacity: 1;
      pointer-events: auto;
    }
    .folder-detail::before {
      content: '';
      position: absolute;
      top: -1px; left: 32px;
      width: 110px; height: 14px;
      background: #fff;
      border-radius: 8px 8px 0 0;
      box-shadow: 0 -2px 6px rgba(0,0,0,0.06);
    }
    .folder-detail-close {
      position: absolute;
      top: 18px; right: 22px;
      width: 36px; height: 36px;
      border-radius: 50%;
      background: rgba(0,0,0,0.05);
      border: 1px solid rgba(0,0,0,0.08);
      font-size: 1.3rem;
      line-height: 1;
      color: #111;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s, transform 0.2s;
    }
    .folder-detail-close:hover { background: rgba(0,0,0,0.1); transform: rotate(90deg); }

    .detail-tag {
      font-family: -apple-system, "SF Mono", Menlo, monospace;
      font-size: 0.72rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: #888;
      display: block;
      margin: 0.4rem 0 0.6rem;
    }
    .detail-title {
      font-family: -apple-system, "SF Pro Display", BlinkMacSystemFont, sans-serif;
      font-size: clamp(1.7rem, 3vw, 2.4rem);
      font-weight: 600;
      letter-spacing: -0.03em;
      line-height: 1.05;
      margin: 0 0 1.1rem;
    }
    .detail-desc {
      font-family: -apple-system, "SF Pro Text", sans-serif;
      font-size: 1rem;
      line-height: 1.6;
      color: #333;
      margin: 0 0 1.5rem;
    }
    .detail-desc strong { color: #111; font-weight: 600; }
    .detail-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 0.45rem;
      margin-bottom: 1.8rem;
    }
    .detail-tags span {
      font-family: -apple-system, "SF Mono", Menlo, monospace;
      font-size: 0.72rem;
      letter-spacing: 0.06em;
      color: #444;
      border: 1px solid rgba(0,0,0,0.18);
      border-radius: 999px;
      padding: 0.32rem 0.85rem;
      background: #fafafa;
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
    }
    .detail-tags span::before {
      content: '';
      width: 8px; height: 8px;
      border-radius: 50%;
      background: var(--lang-color, #999);
    }
    .detail-repo {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.85rem 1.7rem;
      background: #111;
      color: #fff;
      border-radius: 999px;
      text-decoration: none;
      font-family: -apple-system, "SF Pro Text", sans-serif;
      font-size: 0.92rem;
      font-weight: 500;
      transition: transform 0.2s, background 0.2s;
    }
    .detail-repo:hover { background: #000; transform: translateY(-2px); }
    .detail-repo svg { width: 16px; height: 16px; fill: currentColor; }

    /* Responsive */
    @media (max-width: 900px) {
      .codes-stage { height: 260vh; }
      .display { width: clamp(320px, 86vw, 520px); }
      .mac-studio-cube { display: none; }
    }
    @media (max-width: 540px) {
      .folder-app { padding: 8% 6% 8%; }
    }
  </style>
</head>

  <div class="codes-stage" id="codesStage">
    <div class="codes-pinned">

      <div class="mockup-wrap">
        <div class="mac-mockup" id="macMockup">
          <!-- The PNG (display + stand + Mac Studio cube). Drop your image at:
               images/mac-studio-mockup.png  (PNG with transparent background;
               the white rectangle = the screen area we fill below). -->
          <img class="mockup-image" src="images/mac-studio-mockup.png" alt="" aria-hidden="true" />

          <!-- Folder app, positioned absolutely over the screen rectangle of the PNG -->
          <div class="folder-app" id="folderApp">
            <div class="folder-app-bar">
              <input id="projectSearch" class="folder-app-search" type="search" placeholder="Search projects..." autocomplete="off" />
            </div>
            <div class="folder-strip" id="folderStrip"></div>
          </div>
        </div>
      </div>

    </div>
  </div>

  <div class="folder-backdrop" id="folderBackdrop" aria-hidden="true"></div>
  <div class="folder-detail" id="folderDetail" role="dialog" aria-hidden="true" aria-modal="true">
    <button class="folder-detail-close" id="folderDetailClose" aria-label="Close project">×</button>
    <div class="folder-detail-inner" id="folderDetailInner"></div>
  </div>

  <script>
    (function () {
      const PROJECTS = [
        { name: 'Portfolio-site',   repo: 'https://github.com/andrewcjh27/Portfolio-site',
          desc: 'This very site — a minimal portfolio built from scratch with vanilla HTML/CSS, Three.js for the interactive room tour, and scroll-driven animations.',
          tags: [['HTML','#e34c26'],['CSS','#264de4'],['JavaScript','#f1e05a'],['Three.js','#049ef4']] },
        { name: 'Heart-Disease-ML', repo: 'https://github.com/andrewcjh27/Heart-Disease-ML',
          desc: 'Machine learning project for heart disease prediction — data exploration, feature engineering, and model evaluation using Jupyter Notebooks.',
          tags: [['Jupyter','#da5b0b'],['Python','#3572A5']] },
        { name: 'CS61B',            repo: 'https://github.com/andrewcjh27/CS61B',
          desc: 'Data structures and algorithms coursework from UC Berkeley’s CS 61B — implementations of core data structures, sorting algorithms, and graph algorithms.',
          tags: [['Java','#b07219']] },
        { name: 'rad-DINO',         repo: 'https://github.com/andrewcjh27/rad-DINO',
          desc: 'Implementation and experiments with the RAD-DINO model — a self-supervised vision transformer for radiology image analysis and representation learning.',
          tags: [['Python','#3572A5']] },
        { name: '3D-Unet',          repo: 'https://github.com/andrewcjh27/3D-Unet',
          desc: '3D U-Net architecture for volumetric medical image segmentation — a deep-learning model for processing and analyzing 3D medical scans.',
          tags: [['Python','#3572A5']] },
        { name: 'Java-game',        repo: 'https://github.com/andrewcjh27/Java-game',
          desc: 'A game built in Java — exploring object-oriented design patterns, game loops, and interactive graphics programming.',
          tags: [['Java','#b07219']] },
        { name: 'NotesLab',         repo: 'https://github.com/andrewcjh27/NotesLab',
          desc: 'A note-taking iOS app built with Swift — clean UI, local storage, and intuitive organization for capturing ideas on the go.',
          tags: [['Swift','#F05138']] },
        { name: 'Data100',          repo: 'https://github.com/andrewcjh27/Data100',
          desc: 'Coursework from UC Berkeley’s Data 100 — data science principles covering EDA, feature engineering, modeling, and statistical inference.',
          tags: [['Jupyter','#da5b0b'],['Python','#3572A5']] },
        { name: 'Todo-Widget',      repo: 'https://github.com/andrewcjh27/Todo-Widget',
          desc: 'A native iOS home-screen widget for managing to-dos — built with SwiftUI and WidgetKit for quick task capture and at-a-glance progress.',
          tags: [['Swift','#F05138']] },
        { name: 'Soccer-AI',        repo: 'https://github.com/andrewcjh27/Soccer-AI',
          desc: 'AI-powered soccer simulation — a neural network "soccer brain" that learns player positioning, game strategy, and route optimization through reinforcement learning.',
          tags: [['Python','#3572A5']] }
      ];

      const strip = document.getElementById('folderStrip');
      const PANEL_GRADIENTS = [
        ['#ff2f91', '#315bff'],
        ['#00c2ff', '#8b35ff'],
        ['#ff8a25', '#ff2db2'],
        ['#5d4dff', '#0dd3ff'],
        ['#f12b91', '#661dff']
      ];
      PROJECTS.forEach((p, i) => {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'folder-tab';
        btn.dataset.i = String(i);
        btn.dataset.name = p.name.toLowerCase();
        btn.style.zIndex = String(PROJECTS.length - i);
        btn.style.setProperty('--lang-color', p.tags[0][1]);
        btn.style.setProperty('--panel-a', PANEL_GRADIENTS[i % PANEL_GRADIENTS.length][0]);
        btn.style.setProperty('--panel-b', PANEL_GRADIENTS[i % PANEL_GRADIENTS.length][1]);
        const title = document.createElement('span');
        title.className = 'folder-tab-title';
        title.textContent = p.name;
        const meta = document.createElement('span');
        meta.className = 'folder-tab-meta';
        meta.textContent = p.tags.map(([tag]) => tag).join(' / ');
        const summary = document.createElement('span');
        summary.className = 'folder-tab-summary';
        summary.textContent = p.desc;
        btn.append(title, meta, summary);
        strip.appendChild(btn);
      });
      let dragStartX = 0;
      let didDragFolder = false;
      let activeFolderIndex = 0;

      function visibleFolderIndexes() {
        return PROJECTS
          .map((_, i) => i)
          .filter(i => {
            const tab = document.querySelector(`.folder-tab[data-i="${i}"]`);
            return tab && tab.style.display !== 'none';
          });
      }

      function setStackProp(tab, x, y, z, scale, rz, ry, opacity, zIndex, events) {
        tab.style.setProperty('--stack-x', x);
        tab.style.setProperty('--stack-y', y);
        tab.style.setProperty('--stack-z', z);
        tab.style.setProperty('--stack-scale', scale);
        tab.style.setProperty('--stack-rz', rz);
        tab.style.setProperty('--stack-ry', ry);
        tab.style.setProperty('--stack-ry-num', parseFloat(ry) || 0);
        tab.style.setProperty('--stack-opacity', opacity);
        tab.style.setProperty('--stack-brightness', String(0.88 + Math.min(Number(scale), 1) * 0.12));
        tab.style.setProperty('--stack-saturate', String(0.9 + Math.min(Number(scale), 1) * 0.18));
        tab.style.setProperty('--stack-events', events);
        tab.style.zIndex = String(zIndex);
      }

      function updateStack() {
        const tabs = Array.from(document.querySelectorAll('.folder-tab'))
          .filter(t => t.style.display !== 'none');
        if (!tabs.length) return;
        const visible = visibleFolderIndexes();
        if (!visible.includes(activeFolderIndex)) activeFolderIndex = visible[0];
        const activePosition = visible.indexOf(activeFolderIndex);
        const layerStyles = {
          0:  ['0%', '4%', '70px', '1', '0deg', '0deg', '1', 80, 'auto'],
          1:  ['12%', '-10%', '28px', '0.92', '2.5deg', '-8deg', '0.92', 60, 'auto'],
          '-1':['-13%', '-12%', '18px', '0.9', '-2.5deg', '9deg', '0.9', 58, 'auto'],
          2:  ['22%', '-21%', '-8px', '0.82', '5deg', '-14deg', '0.78', 40, 'none'],
          '-2':['-24%', '-22%', '-14px', '0.8', '-5deg', '14deg', '0.76', 38, 'none'],
          3:  ['31%', '-31%', '-36px', '0.72', '7deg', '-18deg', '0.56', 24, 'none'],
          '-3':['-33%', '-32%', '-44px', '0.7', '-7deg', '18deg', '0.52', 22, 'none']
        };
        tabs.forEach(tab => {
          tab.classList.remove('is-front');
          setStackProp(tab, '0%', '16%', '-80px', '0.68', '0deg', '0deg', '0', 1, 'none');
        });
        [0, 1, -1, 2, -2, 3, -3].forEach(offset => {
          const wrapped = (activePosition + offset + visible.length) % visible.length;
          const tab = document.querySelector(`.folder-tab[data-i="${visible[wrapped]}"]`);
          if (!tab) return;
          setStackProp(tab, ...layerStyles[offset]);
          if (offset === 0) tab.classList.add('is-front');
        });
      }

      strip.addEventListener('pointerdown', e => {
        if (e.button !== 0) return;
        dragStartX = e.clientX;
        didDragFolder = false;
        strip.classList.add('dragging');
        strip.setPointerCapture(e.pointerId);
      });
      strip.addEventListener('pointermove', e => {
        if (!strip.classList.contains('dragging')) return;
        const dx = e.clientX - dragStartX;
        if (Math.abs(dx) > 3) didDragFolder = true;
        if (Math.abs(dx) > 48) {
          const visible = visibleFolderIndexes();
          if (visible.length) {
            const current = visible.indexOf(activeFolderIndex);
            const direction = dx < 0 ? 1 : -1;
            activeFolderIndex = visible[(current + direction + visible.length) % visible.length];
            dragStartX = e.clientX;
            updateStack();
          }
        }
      });
      function endFolderDrag(e) {
        if (!strip.classList.contains('dragging')) return;
        strip.classList.remove('dragging');
        if (strip.hasPointerCapture(e.pointerId)) strip.releasePointerCapture(e.pointerId);
        const visible = visibleFolderIndexes();
        if (didDragFolder && visible.length) {
          const current = visible.indexOf(activeFolderIndex);
          const direction = e.clientX < dragStartX ? 1 : -1;
          activeFolderIndex = visible[(current + direction + visible.length) % visible.length];
        }
        requestAnimationFrame(updateStack);
      }
      strip.addEventListener('pointerup', endFolderDrag);
      strip.addEventListener('pointercancel', endFolderDrag);
      requestAnimationFrame(updateStack);

      // ── Scroll-driven mockup scale ─────────────────────────────────
      const stage     = document.getElementById('codesStage');
      const mockup    = document.getElementById('macMockup');
      const folderApp = document.getElementById('folderApp');
      let ticking = false;
      let maxScale = 1;

      // Screen position WITHIN the mockup PNG, in %. Must match the values on
      // .folder-app above (top/left/width/height). Used to compute the
      // translate needed to bring the screen center to the mockup center
      // (and therefore the viewport center) at full zoom.
      const SCREEN_TOP_PCT    = 18.04;
      const SCREEN_LEFT_PCT   = 15.33;
      const SCREEN_WIDTH_PCT  = 66.03;
      const SCREEN_HEIGHT_PCT = 49.64;
      const SCREEN_CX_PCT     = SCREEN_LEFT_PCT + SCREEN_WIDTH_PCT  / 2;   // ≈ 48.35
      const SCREEN_CY_PCT     = SCREEN_TOP_PCT  + SCREEN_HEIGHT_PCT / 2;   // ≈ 42.86
      const SCREEN_OVERSCAN   = 1.035;
      // How far we need to translate (as % of mockup) to move screen center to mockup center.
      const TARGET_TX_PCT = 50 - SCREEN_CX_PCT;   // ≈  1.65
      const TARGET_TY_PCT = 50 - SCREEN_CY_PCT;   // ≈  7.14

      // Compute the scale needed for the screen overlay to FILL the viewport
      // (cover, not fit). max(sx, sy) — the larger dimension overflows and is
      // cropped by overflow:hidden. Net effect: at full zoom ONLY the screen
      // content is visible; mockup bezel/stand/cube are pushed off-screen.
      function computeMaxScale() {
        const prev = mockup.style.transform;
        mockup.style.transform = '';
        const rect = folderApp.getBoundingClientRect();
        mockup.style.transform = prev;
        if (!rect.width || !rect.height) return 1;
        const sx = window.innerWidth  / rect.width;
        const sy = window.innerHeight / rect.height;
        return Math.max(sx, sy) * SCREEN_OVERSCAN;
      }

      function update() {
        const rect = stage.getBoundingClientRect();
        const vh   = window.innerHeight;
        const totalScroll = stage.offsetHeight - vh;
        const raw = -rect.top / totalScroll;
        const progress = Math.max(0, Math.min(1, raw));
        const zoomProgress = Math.min(1, progress * (totalScroll / vh));
        const scale = 1 + zoomProgress * (maxScale - 1);
        // translate(X%, Y%) is % of element's own (unscaled) box.
        // Because translate is applied AFTER scale in `scale(s) translate(...)`
        // the translation is effectively scaled too, which is exactly what we
        // want — the offset grows with zoom so screen center lands on viewport
        // center at full scale.
        const tx = zoomProgress * TARGET_TX_PCT;
        const ty = zoomProgress * TARGET_TY_PCT;
        mockup.style.transform = `scale(${scale}) translate(${tx}%, ${ty}%)`;
        ticking = false;
      }
      function onScroll() {
        if (!ticking) {
          window.requestAnimationFrame(update);
          ticking = true;
        }
      }
      window.addEventListener('scroll', onScroll, { passive: true });
      window.addEventListener('resize', () => { maxScale = computeMaxScale(); onScroll(); }, { passive: true });

      // Recompute max scale once the mockup image has loaded (and on first paint)
      const mockupImg = document.querySelector('.mockup-image');
      function init() { maxScale = computeMaxScale(); update(); }
      if (mockupImg && !mockupImg.complete) mockupImg.addEventListener('load', init, { once: true });
      requestAnimationFrame(init);

      // ── Search filter ──────────────────────────────────────────────
      const search = document.getElementById('projectSearch');
      search.addEventListener('input', () => {
        const q = search.value.trim().toLowerCase();
        document.querySelectorAll('.folder-tab').forEach(t => {
          const hit = !q || t.dataset.name.indexOf(q) !== -1;
          t.style.display = hit ? '' : 'none';
        });
        const visible = visibleFolderIndexes();
        activeFolderIndex = visible.length ? visible[0] : 0;
        requestAnimationFrame(updateStack);
      });
      search.addEventListener('keydown', e => e.stopPropagation());

      // ── Folder click → zoom to front (FLIP-style animation) ───────
      const backdrop  = document.getElementById('folderBackdrop');
      const detail    = document.getElementById('folderDetail');
      const detailInn = document.getElementById('folderDetailInner');
      const detailClose = document.getElementById('folderDetailClose');

      function openFolder(idx) {
        const p = PROJECTS[idx];
        if (!p) return;
        detailInn.innerHTML = '';
        const tag = document.createElement('span'); tag.className = 'detail-tag';
        tag.textContent = String(idx + 1).padStart(2, '0') + ' / 10 — Repository';
        const title = document.createElement('h2'); title.className = 'detail-title'; title.textContent = p.name;
        const desc  = document.createElement('p'); desc.className = 'detail-desc'; desc.textContent = p.desc;
        const tags  = document.createElement('div'); tags.className = 'detail-tags';
        p.tags.forEach(([t, c]) => {
          const s = document.createElement('span');
          s.style.setProperty('--lang-color', c);
          s.textContent = t;
          tags.appendChild(s);
        });
        const repo  = document.createElement('a');
        repo.className = 'detail-repo';
        repo.href = p.repo;
        repo.target = '_blank';
        repo.rel = 'noopener';
        repo.innerHTML = '<svg viewBox="0 0 16 16"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"/></svg>View on GitHub';
        detailInn.append(tag, title, desc, tags, repo);

        document.body.classList.add('folder-open');
        backdrop.setAttribute('aria-hidden', 'false');
        detail.setAttribute('aria-hidden', 'false');
      }
      function closeFolder() {
        document.body.classList.remove('folder-open');
        backdrop.setAttribute('aria-hidden', 'true');
        detail.setAttribute('aria-hidden', 'true');
      }

      strip.addEventListener('click', e => {
        if (didDragFolder) {
          didDragFolder = false;
          return;
        }
        const tab = e.target.closest('.folder-tab');
        if (!tab) return;
        const i = parseInt(tab.dataset.i, 10);
        if (!isNaN(i)) openFolder(i);
      });
      detailClose.addEventListener('click', closeFolder);
      backdrop.addEventListener('click', closeFolder);
      window.addEventListener('keydown', e => {
        if (e.key === 'Escape' && document.body.classList.contains('folder-open')) closeFolder();
      });

    })();
  </script>
  <script src="nav.js"></script>
</body>
</html>
